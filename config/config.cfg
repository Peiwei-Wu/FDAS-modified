[train]
# 初始: batch_size = 16
batch_size = 12
# 微调：Encoder和Decoder主体用小学习率，新分割头单独设置。
lr_encoder = 0.01
lr_decoder = 0.01
lr_head = 0.01
gpu = 0
# num_workers并发子进程数读取H5
num_workers = 4
num_epochs = 500
valid_epoch = 1
patience = 100
# 是否控制训练集纯背景切片比例
filter_background = True
background_ratio = 0.15
# 每batch约33%按病例、器官、切片定向采样，其余随机抽取切片。
foreground_oversample = 0.33
# 保持33%定向裁剪比例，只提高目标器官被选作裁剪目标的概率。
resample_btcv = False
# BTCV原始标签ID：胆囊4、胃7、胰腺11（BTCV8也使用原始标签ID）。
resample_classes = [4, 7, 11]
# 目标器官相对其他器官的抽样权重。
resample_weight = 2.0

[network]
n_classes_mms = 4
n_classes_fb = 2
# 下游微调数据集：
n_classes_btcv = 14
n_classes_btcv8 = 9
n_classes_chaos = 2
n_classes_chaos_mri = 5
n_classes_word = 17
n_classes_amos = 16

[finetune]
# transunet：官方18/12，最后一轮测试；original：原20/4/6，最佳验证权重测试
btcv_split = transunet
# transunet / original
pretrain_dataset = FLARE
data_root_btcv = /data/WPW/datasets/abdomen
data_root_chaos = /data/WPW/datasets/chaos
data_root_chaos_mri = /data/WPW/datasets/chaos/Train_Sets/MR
data_root_word = /data/WPW/datasets/word
data_root_amos = /data/WPW/datasets/amos
output_root = ./outputs
target_size = [512, 512]
pretrain_exp = default
pretrain_checkpoint = iter_870800.pth

[preprocess_btcv]
# BTCV nnUNetPlans参数；仅改变XY spacing，不重采样Z轴。
spacing = [0.7578124403953552, 0.7578124403953552]
normalization = CT
clip = [-962, 319]
mean = 80.92587280273438
std = 140.94772338867188
# 其他数据集必须填写各自的preprocess_word/chaos/amos等配置；缺失直接报错。
# CHAOS_MRI使用逐病例z-score时，明确填写normalization = zscore和对应spacing。

[inference]
step_size = 0.5
# 推理测试时从四个视角来推理不同视角下的图片
mirror_tta = True
# Z-axis Gaussian sigma in slices; 0 disables smoothing. No Softmax.
z_smooth_sigma = 0.5
# 是否加入后处理（无论是根据验证集选择or自己确定）
postprocess = True
